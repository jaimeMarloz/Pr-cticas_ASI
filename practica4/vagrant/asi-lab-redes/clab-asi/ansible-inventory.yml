all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    linux:
      hosts:
        clab-asi-clia:
          ansible_host: 172.31.255.2
        clab-asi-dmza:
          ansible_host: 172.31.255.3
        clab-asi-gwa1:
          ansible_host: 172.31.255.7
        clab-asi-gwa2:
          ansible_host: 172.31.255.4
        clab-asi-gwb:
          ansible_host: 172.31.255.8
        clab-asi-hostb:
          ansible_host: 172.31.255.5
        clab-asi-srva:
          ansible_host: 172.31.255.9
        clab-asi-swa:
          ansible_host: 172.31.255.10
        clab-asi-wan:
          ansible_host: 172.31.255.6
