[options]
; Configuración mínima de Odoo. El host y las credenciales de la base de datos
; llegan por variables de entorno desde docker-compose.yml.
;
; Estos parámetros se ajustan en el bloque 8 (administración); proxy_mode solo si haces la ampliación HTTPS:
;   proxy_mode  = True      detrás de un proxy inverso con HTTPS
;   list_db     = False     oculta el gestor de bases de datos
;   admin_passwd = <clave>  contraseña maestra del gestor de bases de datos
admin_passwd = admin
list_db = True
proxy_mode = False
